[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bethel"
version = "0.2.0"
description = "Sample size and allocation according to Bethel's procedure for multivariate stratified surveys."
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Michele De Meo", email = "micheledemeo@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.20",
  "pandas>=1.3",
]
keywords = ["survey", "sampling", "bethel", "stratified", "sample-size"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/micheledemeo/bethel"
Documentation = "https://github.com/micheledemeo/bethel/blob/main/notebooks/bethel.ipynb"
Repository = "https://github.com/micheledemeo/bethel"
Issues = "https://github.com/micheledemeo/bethel/issues"
"R package (CRAN)" = "https://cran.r-project.org/package=bethel"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0", "twine>=5"]
notebook = ["matplotlib>=3.5", "ipython>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bethel = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
